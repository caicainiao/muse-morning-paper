name: Generate Daily Ebook

on:
  schedule:
    # 每天北京时间早上 6:00 自动运行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持网页上手动一键点击触发测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Generate Daily News EPUB
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generator.py

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "每日晨报合订本 (最新)"
          body: "由 Gemini AI 自动生成并排版的最新一期每日精选合订本。"
          files: output/DailyNews.epub

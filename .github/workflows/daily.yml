name: Generate Daily Ebook

on:
  schedule:
    # 每天早晨 6:30 自动拉取打包 (北京时间 UTC+8)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Daily News EPUB from Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python generator.py

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "每日晨报合订本 (最新)"
          body: "由 Muse 定时资讯自动排版制作的最新一期每日精选合订本。"
          files: output/DailyNews.epub
